name: CSU Library Reserve

on:
  workflow_dispatch:
    inputs:
      action:
        description: '手动运行模式'
        required: true
        default: test
        type: choice
        options:
          - test
          - reserve
  schedule:
    # 北京时间 05:55 启动 runner，准备完后等到 06:00 提交预约。
    - cron: '55 5 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: csu-library-reserve
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Wait until 06:00 Asia/Shanghai
        if: github.event_name == 'schedule'
        shell: python
        run: |
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('Asia/Shanghai'))
          target = now.replace(hour=6, minute=0, second=0, microsecond=0)
          seconds = max(0, (target - now).total_seconds())
          print(f'Current: {now:%Y-%m-%d %H:%M:%S}; waiting {seconds:.0f}s')
          time.sleep(seconds)

      - name: Reserve
        env:
          CSU_USER: ${{ secrets.USER }}
          CSU_PASSWORD: ${{ secrets.PWD }}
          CSU_ACTION: ${{ github.event_name == 'schedule' && 'reserve' || inputs.action }}
        run: python helper.py --action "$CSU_ACTION"

      - name: Save log
        if: always()
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add library.log
          git diff --cached --quiet || git commit -m 'Update library.log'
          git push
